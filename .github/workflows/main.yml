name: Build Nasr Red Eagle APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython
          sudo apt-get update
          sudo apt-get install -y python3-pip build-essential git python3-dev ffmpeg zlib1g-dev libzip-dev liblzma-dev

      - name: Build APK
        run: |
          pip install kivy-deps.khrplatform kivy-deps.gles_khr
          buildozer android debug

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: NasrRedEagle-APK
          path: bin/*.apk
